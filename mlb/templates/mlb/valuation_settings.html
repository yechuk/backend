{% extends "roster/base.html" %}

{% block content %}
<div class="container mt-4">
  <h2>Valuation Settings</h2>
  <p class="text-muted">
    Choose which model to use when converting WAR into dollars ($/WAR) for player valuation.
  </p>
  <form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>
{% endblock %}
